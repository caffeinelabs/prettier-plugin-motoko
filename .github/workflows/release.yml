name: Release

on:
    push:
        branches:
            - main
        paths:
            - packages/mo-fmt/package.json

    workflow_dispatch:

jobs:
    tag-release:
        name: Create release tag
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
            - id: create-tag
              run: RELEASE_TAG=v$(node -p 'require("./packages/mo-fmt/package.json").version') && git tag $RELEASE_TAG && git push origin $RELEASE_TAG
              continue-on-error: true
        outputs:
            tag-outcome: ${{ steps.create-tag.outcome }}

    release:
        name: Release mo-fmt
        needs: [tag-release]
        if: needs.tag-release.outputs.tag-outcome == 'success'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  # @yao-pkg/pkg requires Node >= 22; packaging targets are node22-*, see packages/mo-fmt.
                  node-version: 22.x
                  cache: 'npm'
            - run: npm --prefix packages/mo-fmt ci
            - run: npm --prefix packages/mo-fmt run package
            - name: Get version
              id: version
              run: echo "TAG_NAME=v$(node -p 'require("./packages/mo-fmt/package.json").version')" >> "$GITHUB_OUTPUT"
            - name: Create release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release create "${{ steps.version.outputs.TAG_NAME }}" \
                    --title "mo-fmt ${{ steps.version.outputs.TAG_NAME }}" \
                    --notes 'Portable `mo-fmt` binaries for Linux, macOS, and Windows.' \
                    packages/mo-fmt/pkg/mo-fmt-linux.tar.gz \
                    packages/mo-fmt/pkg/mo-fmt-macos.tar.gz \
                    packages/mo-fmt/pkg/mo-fmt-windows.zip
